services:
  app:
    build: ./app
    image: face-app:1.0
    container_name: face-app
    restart: unless-stopped
    # 用 host 网络：MySQL 只监听宿主机 127.0.0.1:3306，bridge 网络下的容器访问不到
    network_mode: host
    working_dir: /app
    environment:
      TZ: Asia/Shanghai
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-face}
      DB_PASS: ${DB_PASS:?请在 .env 中设置 DB_PASS}
      DB_NAME: ${DB_NAME:-faces}
      THRESHOLD: "0.363"
      MARGIN: "0.03"
      DET_SCORE: "0.55"
      DATA_DIR: /data
      GALLERY_DIR: /data/gallery
      FONT_PATH: /app/fonts/simhei.ttf
      OBJ_CFG: /models/yolov4-tiny.cfg
      OBJ_WEIGHTS: /models/yolov4-tiny.weights
      OBJ_NAMES: /models/coco.names
      OBJ_SCORE: "0.25"
      OBJ_NMS: "0.40"
      OBJ_SIZE: "416"
    volumes:
      - ./models:/models:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: face_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./data/uploads:/srv/face-data/uploads:ro
      - ./data/results:/srv/face-data/results:ro
      - ./data/gallery:/srv/face-data/gallery:ro
