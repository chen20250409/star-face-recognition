server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    client_max_body_size    50m;
    client_body_buffer_size 1m;
    client_body_timeout     120s;
    send_timeout            300s;
    keepalive_timeout       65s;

    access_log /var/log/nginx/face_access.log;
    error_log  /var/log/nginx/face_error.log warn;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length   1024;

    # 前端页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 首页不缓存：改了前端刷新就能看到，不用手动强刷
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后端 API（末尾不加斜杠，保留 /api 前缀）
    location /api/ {
        proxy_pass         http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # 上传原图（静态直服，alias 两端都必须带斜杠）
    location /uploads/ {
        alias /srv/face-data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 标注结果图
    location /results/ {
        alias /srv/face-data/results/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 底库照片（人脸库管理里逐张查看 / 替换 / 删除）
    # 替换后文件名会变（新 uuid），所以可以放心缓存
    location /gallery/ {
        alias /srv/face-data/gallery/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
